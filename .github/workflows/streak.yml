# .github/workflows/streak.yml
name: streak

# Runs 4x per day. On "active" days, exactly ONE slot is chosen
# for the commit (natural-looking time variation).
# On "inactive" days, all 4 runs silently skip.
on:
  schedule:
    - cron: "0 6  * * *"   # 06:00 UTC
    - cron: "0 10 * * *"   # 10:00 UTC
    - cron: "0 14 * * *"   # 14:00 UTC
    - cron: "0 18 * * *"   # 18:00 UTC
  workflow_dispatch:         # manual trigger — always commits

permissions:
  contents: write

jobs:
  auto:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════════
      # 3-WEEK ROTATING SCHEDULE (loops forever)
      #
      #   ISO week number mod 3 → which pattern:
      #     0  →  Week A: Mon Tue Wed Thu  (Mon=1 Tue=2 Wed=3 Thu=4)
      #     1  →  Week B: Wed Thu
      #     2  →  Week C: Mon Wed
      #
      # On an active day, pick exactly ONE of the 4 daily cron slots
      # using a date-based deterministic hash (same slot chosen by all
      # 4 runs on the same day → no double commits).
      # ═══════════════════════════════════════════════════════════════
      - name: Decide whether to commit
        id: decide
        run: |
          # ── Manual trigger always commits ─────────────────────────
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — committing."
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Gather date info ──────────────────────────────────────
          DOW=$(date -u +%u)          # Day of week: 1=Mon … 7=Sun
          WEEK_NUM=$(date -u +%V)     # ISO week number 01-53
          HOUR=$(date -u +%H | sed 's/^0//')  # Current UTC hour (no leading zero)
          TODAY=$(date -u +%Y%m%d)

          CYCLE=$(( 10#$WEEK_NUM % 3 ))

          echo "══════════════════════════════════════"
          echo "Date   : $TODAY"
          echo "DOW    : $DOW  (1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat 7=Sun)"
          echo "Week # : $WEEK_NUM  →  Cycle: $CYCLE"
          echo "Hour   : ${HOUR}:00 UTC"
          echo "══════════════════════════════════════"

          # ── Is today an active day? ───────────────────────────────
          ACTIVE=false

          if [ "$CYCLE" -eq 0 ]; then
            # Week A: Monday(1) Tuesday(2) Wednesday(3) Thursday(4)
            echo "Pattern: Week A — Mon Tue Wed Thu"
            if [ "$DOW" -le 4 ]; then ACTIVE=true; fi

          elif [ "$CYCLE" -eq 1 ]; then
            # Week B: Wednesday(3) Thursday(4)
            echo "Pattern: Week B — Wed Thu"
            if [ "$DOW" -eq 3 ] || [ "$DOW" -eq 4 ]; then ACTIVE=true; fi

          else
            # Week C: Monday(1) Wednesday(3)
            echo "Pattern: Week C — Mon Wed"
            if [ "$DOW" -eq 1 ] || [ "$DOW" -eq 3 ]; then ACTIVE=true; fi
          fi

          if [ "$ACTIVE" = "false" ]; then
            echo "⏭  Not an active day — skipping."
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ Active day!"

          # ── Pick exactly ONE slot for today's commit ──────────────
          # Deterministic hash of today's date so all 4 runs agree
          DAY_HASH=$(echo "$TODAY" | cksum | awk '{print $1}')
          AVAILABLE_SLOTS=(6 10 14 18)
          NUM_SLOTS=${#AVAILABLE_SLOTS[@]}
          CHOSEN_IDX=$(( DAY_HASH % NUM_SLOTS ))
          CHOSEN_HOUR=${AVAILABLE_SLOTS[$CHOSEN_IDX]}

          echo "Chosen commit slot: ${CHOSEN_HOUR}:00 UTC  (current: ${HOUR}:00 UTC)"

          if [ "$HOUR" -eq "$CHOSEN_HOUR" ]; then
            echo "🟢 This is the chosen slot — committing!"
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "⏭  Not the chosen slot — skipping this run."
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update daily file
        if: steps.decide.outputs.should_commit == 'true'
        run: echo "$(date -u)" >> daily.txt

      - name: Commit & push
        if: steps.decide.outputs.should_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "DarainHyder"
          git config user.email "176991998+DarainHyder@users.noreply.github.com"
          git add daily.txt
          git commit -m "auto streak $(date -u)" || exit 0
          git push https://x-access-token:${GH_TOKEN}@github.com/DarainHyder/Autobot.git HEAD:main
